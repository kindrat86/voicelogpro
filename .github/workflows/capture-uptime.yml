# Uptime check for BOTH live email-capture endpoints.
#
# Runs on GitHub, NOT on the Mac mini — deliberately. The 2026-08-09 outage was
# the Mac mini's own listener crash-looping, so a monitor hosted there would
# have died with the thing it was supposed to be watching. This must stay
# off-box to be worth anything.
#
# ALERT MODEL (revised 2026-08-15, after the 5-minute tunnel blip):
# The deduplicated issue IS the alert. The run itself stays GREEN whenever the
# alert was delivered (issue filed, or an outage issue already open). The OLD
# behavior — exit 1 on every failing tick — meant one "Run failed" email per
# 15-minute tick for the whole outage (a 3-day outage ≈ 288 emails) even though
# the issue had already paged on minute one. The run goes RED only when the
# alert path itself is broken: endpoints down AND no issue could be filed or
# found — that is the one state where an outage would otherwise be silent.
#
# On failure it opens ONE deduplicated issue (label: capture-outage) and closes
# it automatically on recovery. The auto-close is load-bearing: dedup only stays
# correct if a resolved outage clears the issue, otherwise the next outage would
# find one already open and stay silent.
name: capture-uptime

on:
  schedule:
    # Every 15 minutes. GitHub delays high-frequency crons under load, which is
    # fine — this is here to shrink "3 days of lost leads" to "minutes", not to
    # be a precise heartbeat.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Scheduled workflows only run from the DEFAULT branch — this file has no effect
# until it is merged to main.

permissions:
  contents: read
  issues: write

concurrency:
  group: capture-uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Probe capture endpoints
        id: probe
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/check-capture-endpoints.mjs 2>&1 | tee probe.log

      # DOWN → file the ONE deduplicated issue. Deliberately exits 0: the issue
      # is the alert, and a red run would only add per-tick email spam.
      - name: Open outage issue
        id: outage
        if: steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create capture-outage --color B60205 \
            --description "A live email-capture endpoint is down" 2>/dev/null || true

          existing=$(gh issue list --label capture-outage --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "Outage issue #$existing already open — not filing a duplicate."
            echo "delivered=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "A live email-capture endpoint is failing its uptime probe."
            echo "**Opt-ins submitted right now are being silently discarded.**"
            echo
            echo '```'
            cat probe.log
            echo '```'
            echo
            echo "Probe: \`node scripts/check-capture-endpoints.mjs\`"
            # Safe interpolation: server_url/repository/run_id are GitHub-set,
            # not attacker-controllable event fields.
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "This issue closes itself when the probe passes again."
          } > issue.md

          gh issue create --title "Capture endpoint DOWN" \
            --label capture-outage --body-file issue.md
          echo "delivered=true" >> "$GITHUB_OUTPUT"

      # Red ONLY when the alert could not be delivered — endpoints down AND no
      # outage issue exists. This is the silent-outage canary.
      - name: Fail if the outage alert could not be delivered
        if: steps.probe.outcome == 'failure' && steps.outage.outputs.delivered != 'true'
        run: |
          echo "::error::Capture endpoints are DOWN and no outage issue exists — the alert was NOT delivered. File it manually."
          cat probe.log
          exit 1

      - name: Close outage issue on recovery
        if: steps.probe.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --label capture-outage --state open \
            --json number --jq '.[].number'); do
            gh issue close "$n" --comment \
              "Capture endpoints are healthy again — closed automatically by capture-uptime."
          done
